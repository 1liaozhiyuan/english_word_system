services:
  postgres:
    image: postgres:16
    container_name: english-word-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: english_words
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d english_words']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
